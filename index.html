<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthlink Stock Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body {
        touch-action: manipulation;
      }
      td,
      th {
        padding: 6px 12px !important;
      }
      .table-row:nth-child(even) {
        background-color: #fcfcfc;
      }
    </style>
  </head>
  <body class="bg-slate-100 text-sm pb-10">
    <div class="sticky top-0 bg-green-900 p-4 shadow-lg z-30">
      <div class="flex justify-between items-center w-full px-4">
        <input
          type="text"
          id="searchBar"
          oninput="filterList()"
          placeholder="🔍 Search through all products..."
          class="w-[80%] p-4 rounded-xl border-none outline-none text-lg shadow-inner"
        />

        <a
          href="orders.html"
          class="ml-4 bg-white text-green-900 font-bold px-6 py-3 rounded-xl shadow hover:bg-green-100"
        >
          View Orders →
        </a>
      </div>
    </div>

    <div class="flex justify-center my-8">
      <div
        class="bg-white p-8 rounded-2xl shadow-md border border-slate-200 w-[80%]"
      >
        <h2
          class="text-base font-bold text-slate-700 uppercase mb-6 border-b pb-2"
        >
          Add New Product to Inventory
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div class="md:col-span-2">
            <label
              class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
              >Product Name</label
            >
            <input
              type="text"
              id="newName"
              placeholder="e.g. Bitter Lemon Tonic"
              class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50"
            />
          </div>
          <div>
            <label
              class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
              >Starting Qty</label
            >
            <input
              type="number"
              id="newStock"
              placeholder="0"
              class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50"
            />
          </div>
          <div>
            <label
              class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
              >Category</label
            >
            <select
              id="newTable"
              class="w-full p-3 border rounded-lg bg-slate-50 outline-none"
            >
              <option value="singles">Singles / Bottles</option>
              <option value="cases">Unopened Cases</option>
            </select>
          </div>
        </div>
        <button
          onclick="addNewProduct()"
          class="mt-6 w-full bg-blue-600 text-white p-4 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg text-base"
        >
          SAVE PRODUCT TO DATABASE
        </button>
      </div>
    </div>

    <div class="w-full px-4">
      <div class="flex flex-col xl:flex-row gap-6 w-full">
        <div
          class="w-full xl:w-1/2 bg-white rounded-2xl shadow-sm border border-slate-300 overflow-hidden"
        >
          <div
            class="bg-slate-50 p-4 border-b flex justify-between items-center"
          >
            <h2
              class="font-black text-green-800 text-sm uppercase tracking-widest"
            >
              Singles / Bottles
            </h2>
            <span class="text-[10px] text-slate-400 font-bold italic"
              >Use +/− to adjust quantity</span
            >
          </div>
          <table class="w-full text-left border-collapse">
            <thead>
              <tr
                class="bg-slate-100 text-[11px] text-slate-500 uppercase font-bold border-b"
              >
                <th class="border-r">Item Name</th>
                <th class="w-36 text-center">In Stock</th>
                <th class="w-12"></th>
              </tr>
            </thead>
            <tbody id="singles-list"></tbody>
          </table>
        </div>

        <div
          class="w-full xl:w-1/2 bg-white rounded-2xl shadow-sm border border-slate-300 overflow-hidden"
        >
          <div
            class="bg-slate-50 p-4 border-b flex justify-between items-center"
          >
            <h2
              class="font-black text-blue-800 text-sm uppercase tracking-widest"
            >
              Unopened Cases
            </h2>
            <span class="text-[10px] text-slate-400 font-bold italic"
              >Use +/− to adjust quantity</span
            >
          </div>
          <table class="w-full text-left border-collapse">
            <thead>
              <tr
                class="bg-slate-100 text-[11px] text-slate-500 uppercase font-bold border-b"
              >
                <th class="border-r">Case Name</th>
                <th class="w-36 text-center">In Stock</th>
                <th class="w-12"></th>
              </tr>
            </thead>
            <tbody id="cases-list"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const SUPABASE_URL = "https://wgtmrqtikbbkdemosbaq.supabase.co";
      const SUPABASE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndndG1ycXRpa2Jia2RlbW9zYmFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MjA1MzUsImV4cCI6MjA4NzM5NjUzNX0.O8jE600mTH7jRRYNmbsanYQsqP9mLe_zk8BxgAJo44M";
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      let dataStore = { singles: [], cases: [] };

      async function fetchData() {
        const { data: s } = await supabaseClient
          .from("singles")
          .select("*")
          .order("name");
        const { data: c } = await supabaseClient
          .from("cases")
          .select("*")
          .order("name");
        dataStore.singles = s || [];
        dataStore.cases = c || [];
        filterList();
      }

      function filterList() {
        const query = document.getElementById("searchBar").value.toLowerCase();
        renderTable(
          "singles-list",
          dataStore.singles.filter((i) => i.name.toLowerCase().includes(query)),
          "singles"
        );
        renderTable(
          "cases-list",
          dataStore.cases.filter((i) => i.name.toLowerCase().includes(query)),
          "cases"
        );
      }

      function renderTable(id, items, table) {
        const container = document.getElementById(id);
        container.innerHTML = items
          .map(
            (item) => `
          <tr class="table-row border-b border-slate-100 hover:bg-slate-50 transition">
            <td class="border-r font-semibold text-slate-800 text-base">${item.name}</td>
            <td class="text-center">
              <div class="flex items-center justify-center gap-2">
                <button onclick="adjustStock('${table}', ${item.id}, -1)"
                  class="w-7 h-7 flex items-center justify-center rounded-full bg-slate-200 hover:bg-red-100 hover:text-red-600 text-slate-600 font-bold text-base transition active:scale-95">−</button>
                <span id="qty-${table}-${item.id}" class="font-black text-lg text-blue-800 w-10 text-center">${item.stock_count}</span>
                <button onclick="adjustStock('${table}', ${item.id}, +1)"
                  class="w-7 h-7 flex items-center justify-center rounded-full bg-slate-200 hover:bg-green-100 hover:text-green-700 text-slate-600 font-bold text-base transition active:scale-95">+</button>
              </div>
            </td>
            <td class="text-center">
              <button onclick="deleteProduct('${table}', ${item.id}, '${item.name}')"
                class="text-slate-300 hover:text-red-500 transition-colors text-xl">×</button>
            </td>
          </tr>
        `
          )
          .join("");
      }

      async function adjustStock(table, id, delta) {
        const list = table === "singles" ? dataStore.singles : dataStore.cases;
        const item = list.find((i) => i.id === id);
        if (!item) return;

        const newVal = Math.max(0, item.stock_count + delta);
        item.stock_count = newVal;

        const span = document.getElementById("qty-" + table + "-" + id);
        span.textContent = newVal;
        span.style.color = "#ca8a04";

        const { error } = await supabaseClient
          .from(table)
          .update({ stock_count: newVal })
          .eq("id", id);

        if (!error) {
          span.style.color = "#16a34a";
          setTimeout(() => {
            span.style.color = "";
          }, 800);
        } else {
          item.stock_count -= delta;
          span.textContent = item.stock_count;
          span.style.color = "#dc2626";
          alert("Error saving: " + error.message);
        }
      }

      async function addNewProduct() {
        const name = document.getElementById("newName").value.trim();
        const stock = parseInt(document.getElementById("newStock").value) || 0;
        const table = document.getElementById("newTable").value;
        if (!name) return;

        const { error } = await supabaseClient
          .from(table)
          .insert([{ name, stock_count: stock }]);
        if (!error) {
          document.getElementById("newName").value = "";
          document.getElementById("newStock").value = "";
          fetchData();
        }
      }

      async function deleteProduct(table, id, name) {
        if (confirm('Delete "' + name + '" permanently?')) {
          await supabaseClient.from(table).delete().eq("id", id);
          fetchData();
        }
      }

      window.onload = fetchData;
    </script>
  </body>
</html>
